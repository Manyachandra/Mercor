# CI workflow for Mercor Referral Network — pytest + ruff
# Adjusted for flat source/ layout and requirements.txt deps.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests/ -v
      - name: Lint
        run: python -m ruff check source/ tests/
