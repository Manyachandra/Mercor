[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mercor-challenge"
version = "1.0.0"
description = "Complete implementation of the Mercor Referral Network coding challenge — DAG referral graph, reach analysis, influencer identification, growth simulation, and bonus optimization."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "ruff"]

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
